  html[data-theme="dark"] .dash-hub.on{background:var(--accent);border-color:var(--accent);}
  html[data-theme="dark"] .photo-lightbox{background:rgba(4,8,18,0.92);}
  html[data-theme="dark"] .email-pref-row td{background:var(--surface-alt);}
  html[data-theme="dark"] .theme-switch{border-color:var(--line);background:var(--surface-alt);}
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{
    background:var(--surface);color:var(--ink);border-color:var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#000F41 0%,#152B63 55%,#0A2D8F 100%);
    padding:24px;
  }
   .login-card{
    width:100%;max-width:420px;background:var(--surface);border-radius:10px;padding:28px 26px 24px;
    box-shadow:0 16px 40px rgba(0,0,0,.25);
  }
  .login-card h1{font-size:28px;margin:8px 0 4px;}
  .login-card .hint{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .login-card.raise-card{max-width:560px;}
  .raise-hp{position:absolute;left:-9999px;height:0;width:0;opacity:0;pointer-events:none;}
  .raise-thanks{padding:8px 0 4px;}
  .raise-thanks .num{font-family:var(--font-display);font-size:28px;color:var(--navy);font-weight:700;}
  .chip-dealer{background:color-mix(in srgb, var(--accent) 16%, white);color:var(--accent);}
  .role-pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#A9B4D6;}
  .audit-row{display:grid;grid-template-columns:160px 120px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  @media (max-width:700px){ .audit-row{grid-template-columns:1fr;} }
  .audit-day{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface);overflow:hidden;}
  .audit-day-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border:none;background:var(--surface-alt);color:inherit;font:inherit;cursor:pointer;text-align:left;
  }
  .audit-day-head:hover{background:var(--accent-soft);}
  .audit-day-head strong{font-size:14px;}
  .audit-day-head span{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .audit-day-body{padding:4px 14px 10px;}
  .usage-row{display:grid;grid-template-columns:minmax(110px,1.4fr) minmax(92px,0.9fr) minmax(90px,1fr) minmax(88px,0.9fr) repeat(3,minmax(52px,0.7fr));gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px;}
  .live-now{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;}
  .live-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper,var(--surface));font-size:13px;min-width:0;max-width:100%;}
  .live-chip .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex-shrink:0;box-shadow:0 0 0 4px rgba(22,163,74,.18);}
  .live-chip.recent .dot{background:#d97706;box-shadow:0 0 0 4px rgba(217,119,6,.16);}
  .live-chip.idle .dot{background:#94a3b8;box-shadow:none;}
  .live-chip .who{font-weight:650;min-width:0;}
  .live-chip .scr{color:var(--ink-soft);font-size:12px;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:12px;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;}
  .status-pill.recent .dot{background:#d97706;}
  .status-pill.idle .dot{background:#94a3b8;}
  @media(max-width:700px){
    .usage-row,.usage-row.head{grid-template-columns:1fr 1fr;}
    .usage-row.head{display:none;}
    .usage-row > div:first-child{grid-column:1 / -1;}
    .usage-row > div[data-k]::before{content:attr(data-k);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
    .live-chip{width:100%;}
  }
  .usage-row.head{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;}
  .usage-row .n{font-weight:700;}
  .usage-note{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:0 0 12px;}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:0.01em;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}

  /* ---- Layout shell ---- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--navy);color:#E7EBF6;
    display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
    border-right:3px solid var(--accent);
  }
  .sidebar-brand{
    padding:20px 20px 16px 20px;border-bottom:1px solid rgba(231,235,246,0.12);
  }
  .sidebar-brand .gea-mark{
    display:block;margin-bottom:10px;
    font-size:12px;letter-spacing:0.04em;color:#AEB9DA;font-weight:700;
  }
  .sidebar-brand .kicker{font-size:11px;letter-spacing:0.08em;color:#A9B4D6;text-transform:none;}
  .sidebar-brand h1{font-size:22px;line-height:1.15;color:#fff;}
  .nav-list{list-style:none;margin:0;padding:14px 10px;flex:1;}
  .nav-item{margin-bottom:2px;}
  .nav-link{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:5px;
    color:#C3CBE6;text-decoration:none;font-size:14px;font-weight:500;
    border:1px solid transparent;transition:background .12s ease;
    background:none;width:100%;text-align:left;font-family:var(--font-body);cursor:pointer;
  }
  .nav-link:hover{background:rgba(255,255,255,0.06);}
  .nav-link.active{background:rgba(10,45,143,0.35);color:#fff;border-color:rgba(255,255,255,0.25);}
  .nav-link .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0;flex-shrink:0;}
  .nav-link.active .dot{opacity:1;}
  .sidebar-foot{padding:14px 20px;font-size:11px;color:#8894BC;border-top:1px solid rgba(231,235,246,0.1);}

  .main{margin-left:220px;flex:1;min-width:0;}

  .btn-back{flex-shrink:0;font-weight:700;}
  .btn-back[disabled]{opacity:.35;cursor:default;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .topbar-left > div{min-width:0;}
  .topbar h2{font-size:22px;}
  .topbar .subtitle{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .view-dashboard .topbar-left{flex:0 0 auto;}
  .content{padding:24px 28px 60px 28px;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:5px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:13.5px;font-weight:600;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-danger{color:var(--crit);border-color:var(--crit);background:transparent;}
  .btn-danger:hover{background:#FBEAE8;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---- Dashboard ---- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi-card .label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
  .kpi-card .value{font-family:var(--font-display);font-size:34px;font-weight:700;margin-top:6px;line-height:1;}
  .kpi-card.hero{background:var(--accent);color:#fff;border-color:var(--accent);}
  .kpi-card.hero .label{color:#C7D2F5;}
  .kpi-card.hero .value{font-size:22px;}
  .dash-hubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 20px;}
  .dash-hub{
    border:1px solid var(--navy);background:var(--navy);color:#fff;
    border-radius:10px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .dash-hub.on{background:var(--accent);border-color:var(--accent);}
  .dh-main{
    appearance:none;border:0;background:transparent;color:inherit;font:inherit;
    text-align:left;cursor:pointer;padding:20px 18px 12px;
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex:1;width:100%;
  }
  .dash-hub:hover{background:var(--navy-soft);}
  .dash-hub.on:hover{background:var(--accent-hover);}
  .dash-hub .dh-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#C7D2F5;}
  .dash-hub .dh-title{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.05;}
  .dash-hub .dh-count{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1;margin-top:4px;display:inline-flex;align-items:baseline;gap:8px;}
  .dash-hub .dh-counts{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin-top:4px;}
  .dash-hub .dh-counts .dh-count{margin-top:0;}
  .dash-hub .dh-count span{font-size:13px;font-weight:600;letter-spacing:.02em;margin-left:0;color:#C7D2F5;font-family:var(--font-body);}
  .dh-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .dh-meta span{
    font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12);
    border-radius:999px;padding:4px 8px;color:#fff;
  }
  .dh-list{
    appearance:none;border:0;border-top:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.18);color:#fff;font:inherit;font-size:13px;font-weight:700;
    padding:10px 16px;cursor:pointer;text-align:left;width:100%;
  }
  .dh-list:hover{background:rgba(0,0,0,.28);}
  .herd-desk{margin:0 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
  .herd-desk h3{margin:0 0 8px;font-size:16px;}
  .herd-desk p{margin:0 0 10px;color:var(--ink-soft);font-size:13px;}
  .herd-desk .hd-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .visit-brief{margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-alt);font-size:13px;}
  .visit-brief.hot{border-color:var(--crit);background:color-mix(in srgb, var(--crit) 10%, var(--surface));}
  .visit-brief.warn{border-color:var(--high);background:color-mix(in srgb, var(--high) 12%, var(--surface));}
  .visit-brief h4{margin:0 0 6px;font-size:13px;}
  .visit-brief ul{margin:6px 0 0;padding-left:18px;}
  .risk-hot{background:color-mix(in srgb, var(--crit) 16%, white);color:var(--crit);}
  .risk-warn{background:color-mix(in srgb, var(--high) 16%, white);color:var(--high);}
  .risk-note{background:var(--surface-alt);color:var(--ink);}
  .dash-hubs.compact{margin-bottom:14px;grid-template-columns:repeat(4,minmax(0,1fr));}
  .dash-hubs.ov.compact{grid-template-columns:repeat(2,minmax(0,1fr));}
  .dash-hubs.audit{grid-template-columns:repeat(3,minmax(0,1fr));}
  .dash-hubs.audit.compact{grid-template-columns:repeat(3,minmax(0,1fr));}
  .ov-section{font-family:var(--font-display);font-size:18px;font-weight:700;margin:4px 0 12px;color:var(--ink);}
  .dash-hubs.compact .dh-main{padding:12px 14px 8px;}
  .dash-hubs.compact .dh-title{font-size:18px;}
  .dash-hubs.compact .dh-count{font-size:26px;margin-top:2px;}
  .dash-hubs.compact .dh-kicker{font-size:10px;}
  @media(max-width:720px){
    .dash-hubs.audit,
    .dash-hubs.audit.compact{grid-template-columns:1fr;}
    .dh-main{padding:12px 12px 8px;}
    .dash-hub .dh-title{font-size:16px;}
    .dash-hub .dh-count{font-size:26px;margin-top:2px;}
    .dash-hub .dh-kicker{font-size:9px;}
    .dh-meta{margin-top:6px;gap:4px;}
    .dh-meta span{font-size:10px;padding:3px 6px;}
    .dh-meta span:nth-child(n+3){display:none;}
    .dh-list{padding:8px 10px;font-size:12px;}
  }

  .panel-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.panel-row{grid-template-columns:1fr;}}
  .panel-toggle{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;}
  .panel-toggle .panel-chevron{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .panel h3{font-size:16px;margin-bottom:14px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
  .bar-row.clickable-bar{cursor:pointer;border-radius:4px;padding:3px 6px;margin:-3px -6px 5px -6px;transition:background .12s ease;}
  .bar-row.clickable-bar:hover{background:var(--accent-soft);}
  .bar-row.clickable-bar:hover .bar-label{color:var(--accent);font-weight:600;}
  .recent-issue-row{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:background .12s ease, border-color .12s ease;}
  .recent-issue-row:last-child{margin-bottom:0;}
  .recent-issue-row:hover{background:var(--accent-soft);border-color:var(--accent);}
  .bar-label{width:150px;flex-shrink:0;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--surface-alt);border-radius:3px;height:14px;overflow:hidden;display:flex;}
  .bar-fill.open{background:var(--steel);height:100%;}
  .bar-fill.closed{background:#8A8F87;height:100%;}

  .hrs-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px;}
  .hrs-kpis.four{grid-template-columns:repeat(4,minmax(110px,1fr));}
  .hrs-cols.wide{width:220px;grid-template-columns:repeat(5,1fr);}
  .hrs-range{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .hrs-range input[type=month]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);}
  .hrs-range-note{font-weight:500;font-size:11px;}

  .hrs-kpis > div{background:var(--surface-alt);border-radius:6px;padding:10px 12px;}
  .hrs-kpis .label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .hrs-kpis .value{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:4px;}
  .hrs-cols{width:150px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:right;font-size:11px;font-weight:700;color:var(--ink);}
  .bar-row.hrs-head{margin-bottom:6px;opacity:.7;}
  .bar-row.hrs-head .hrs-cols{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .bar-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--ink-soft);margin:-6px 0 10px 0;align-items:center;}
  .bar-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  .kpi-split{margin-top:10px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .kpi-split b{color:var(--ink);font-weight:700;}
  .kpi-created{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .kpi-created > div{background:var(--surface-alt);border-radius:6px;padding:8px 10px;}
  .kpi-created .label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;line-height:1.25;}
  .kpi-created .n{font-family:var(--font-display);font-size:20px;font-weight:700;margin-top:3px;color:var(--ink);}
  .kpi-mini{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--surface-alt);}
  .kpi-mini span{display:block;height:100%;}
  .dxp-row{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface);overflow:hidden;}
  .dxp-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;text-align:left;}
  .dxp-head:hover{background:var(--accent-soft);}
  .dxp-name{font-weight:700;}
  .dxp-count{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .dxp-body{border-top:1px solid var(--line);padding:4px 8px 8px;}
  .dxp-prod{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 8px;border:none;background:transparent;color:inherit;font:inherit;cursor:pointer;border-radius:6px;}
  .dxp-prod:hover{background:var(--accent-soft);}
  .dxp-prod .n{font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;gap:2px;}
  .dxp-prod .n .oc{font-size:10px;font-weight:600;color:var(--ink-soft);}
  .dxp-count b{color:var(--ink);font-weight:800;}

  .bar-fill{height:100%;border-radius:3px;}
  .bar-val{width:26px;text-align:right;flex-shrink:0;font-weight:600;color:var(--ink);}
  .bar-split{min-width:108px;flex-shrink:0;text-align:right;line-height:1.15;}
  .bar-split .tot{display:block;font-weight:800;font-size:13px;color:var(--ink);}
  .bar-split .oc{display:block;font-size:10px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .panel-meta{font-size:12px;font-weight:500;color:var(--ink-soft);white-space:nowrap;}
  .bar-legend-tot{margin-left:auto;font-weight:700;color:var(--ink);}

  /* ---- Tables ---- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);
    font-size:13px;color:var(--ink);
  }
  .toolbar .search{flex:1;min-width:160px;}
  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:920px;}
  thead th{
    text-align:left;padding:10px 12px;background:var(--surface-alt);color:var(--ink-soft);
    font-size:11px;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;
    border-bottom:1px solid var(--line);position:sticky;top:0;
  }
  
  tbody tr.list-row td{height:52px;max-height:52px;vertical-align:middle;white-space:nowrap;}
  tbody tr.list-row .cell-title{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody tr.list-row .cell-desc{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
  tbody tr.list-row td.cell-issue-line{min-width:460px;width:42%;max-width:720px;overflow:hidden;white-space:nowrap;}
  tbody tr.list-row.expanded-row td{background:var(--accent-soft);}
  tr.expand-row td{padding:0;background:var(--surface-alt);white-space:normal;}
  .expand-panel{padding:12px 14px 14px;}
  .expand-desc{font-size:13px;color:var(--ink);margin:0 0 10px;line-height:1.45;}
  .quick-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
  .quick-row input[type=text], .quick-row select{padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit;pointer-events:auto;position:relative;z-index:2;}
  .quick-row input[type=text]{flex:1;min-width:160px;}
  .issue-line{display:flex;align-items:center;gap:10px;width:100%;min-width:0;max-width:100%;}
  .il-title{font-weight:700;flex:0 1 150px;min-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .il-desc{flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);font-size:12.5px;}
  .il-cust,.il-hrs{flex:0 1 auto;font-size:12px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .il-cust{color:var(--navy);max-width:160px;}
  html[data-theme="dark"] .il-cust{color:var(--ink);}
  .il-hrs{color:var(--steel);flex:0 0 auto;}
  .il-act{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ink-soft);}
  .compact-list{display:flex;flex-direction:column;gap:8px;}
  .issue-row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;max-width:100%;
  }
  .issue-row.is-open{border-color:var(--accent);}
  .issue-row.is-waiting-archive{border-color:var(--st-resolved);border-width:2px;background:#F3F8F4;}
  html[data-theme="dark"] .issue-row.is-waiting-archive{background:#1a2e22;}
  .ready-archive-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;}
  .ready-archive-head strong{color:var(--st-resolved);}
  .issue-row.is-open .issue-row-main{background:var(--accent-soft);}
  .issue-row-body{display:flex;flex-direction:column;align-items:stretch;min-width:0;}
  .issue-row-main{
    flex:1 1 auto;min-width:0;text-align:left;background:transparent;border:none;
    color:inherit;font:inherit;padding:10px 14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .issue-row-main:hover{background:var(--accent-soft);}
  .ir-head{display:flex;align-items:center;gap:8px;min-width:0;}
  .ir-id{font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0;color:var(--ink-faint);font-size:12px;}
  .ir-age,.ir-date{flex-shrink:0;font-size:12px;color:var(--ink-soft);}
  .ir-chips{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;flex-shrink:0;}
  .ir-title{font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ir-mid{display:flex;align-items:center;gap:10px;min-width:0;margin-top:4px;}
  .ir-desc{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);font-size:12.5px;}
  .ir-facts{display:inline-flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0;}
  .ir-act{
    width:100%;margin-top:8px;min-width:0;
    font-size:15px;line-height:1.4;font-weight:600;color:var(--ink);
    overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    white-space:normal;word-break:break-word;
  }
  .issue-row.is-open .ir-act{
    display:block;-webkit-line-clamp:unset;overflow:visible;
  }
  .issue-row.is-open .ir-desc{white-space:normal;overflow:visible;text-overflow:clip;}
  .ir-act-label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;}
  .ir-sub{margin-top:3px;font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .product-picks{display:flex;flex-wrap:wrap;gap:5px;}
  .product-picks label{display:inline-flex;align-items:center;gap:5px;margin:0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-alt);font-size:12px;font-weight:600;cursor:pointer;max-width:100%;line-height:1.2;}
  .product-picks input{width:13px;height:13px;margin:0;flex-shrink:0;accent-color:var(--accent);}
  .product-picks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--navy);}
  .product-picks .pp-short{display:none;}
  .ir-type{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);flex-shrink:0;}
  .ir-actions{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:center;gap:6px;flex-shrink:0;
    padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-alt);width:100%;
  }
  .ir-actions .btn, .ir-actions label.btn{
    width:100%;justify-content:center;cursor:pointer;margin:0;min-height:40px;
  }
  .issue-row .expand-panel{border-top:1px solid var(--line);background:var(--surface-alt);}
  .mcard{max-height:none;}
  .mcard.compact .mcard-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcard.compact .mcard-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcard.compact .mcard-desc,.mcard.compact .mcard-act{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .mcard.compact .mcard-top{margin-bottom:2px;}
  .mcard-hit{display:block;width:100%;text-align:left;background:transparent;border:none;color:inherit;font:inherit;padding:0;cursor:pointer;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#F5F6F2;}
  tbody tr.clickable-row{cursor:pointer;}
  tbody tr.clickable-row:hover{background:var(--accent-soft);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-title{font-weight:600;}
  .cell-desc{color:var(--ink-soft);font-size:12.5px;max-width:280px;}
  .cell-notes{color:var(--ink-soft);font-size:12.5px;max-width:220px;}
  .row-actions{display:flex;gap:6px;}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .chip .dot{width:6px;height:6px;border-radius:50%;}
  .due-date{font-weight:600;}
  .due-date.overdue{color:var(--overdue);}
  .due-date .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;margin-left:5px;background:var(--overdue);color:#fff;padding:1px 6px;border-radius:10px;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h4{color:var(--ink);font-size:18px;margin-bottom:6px;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,26,20,0.5);display:flex;
    align-items:center;justify-content:center;padding:16px;overflow:hidden;z-index:50;
  }
  .modal{
    background:var(--surface);border-radius:8px;width:100%;max-width:620px;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
    display:flex;flex-direction:column;
    max-height:min(92vh, calc(100svh - 24px));
    min-height:0;overflow:hidden;
  }
  .modal-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;background:var(--surface);}
  .modal-head h3{font-size:19px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px 8px;}
  .modal > #record-form{
    display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;
  }
  .modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal-body .full{grid-column:1 / -1;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex:0 0 auto;background:var(--surface);flex-wrap:wrap;}
  .field{min-width:0;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input,.field select,.field textarea{
    width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;color:var(--ink);background:var(--surface);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .customer-field{position:relative;}
  .cust-suggest{
    position:absolute;left:0;right:0;top:calc(100% - 2px);z-index:30;
    background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
    max-height:200px;overflow:auto;
  }
  .cust-suggest button{
    display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
    padding:8px 10px;border:none;border-bottom:1px solid var(--line);background:var(--surface);
    text-align:left;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .cust-suggest button:last-child{border-bottom:none;}
  .cust-suggest button:hover{background:var(--accent-soft);}
  .cust-suggest .count{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .cust-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .cust-hint.match{color:var(--st-resolved);font-weight:600;}
  .cust-hint.new{color:var(--steel);}
  .mail-log{margin-top:18px;}
  .mail-row{display:grid;grid-template-columns:92px 1fr auto;gap:8px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .mail-row .st{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
  .mail-row .st.queued{background:#FFF6EE;color:var(--high);border-color:#F0C9A8;}
  .mail-row .st.sending{background:#FFF8E1;color:#8A6A12;border-color:#E6D48A;}
  .mail-row .st.sent{background:#EAF6EE;color:var(--st-resolved);border-color:#B7D8C0;}
  .mail-row .st.failed{background:#FBEAE8;color:var(--crit);border-color:#E7B6B0;}
  .mail-row .to{font-weight:700;word-break:break-all;}
  .mail-row .meta{font-size:12px;color:var(--ink-soft);}
  .mail-row .err{font-size:12px;color:var(--crit);margin-top:2px;}
  @media (max-width:700px){ .mail-row{grid-template-columns:1fr auto;} }
  .fu-check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .fu-check input{width:16px;height:16px;}
  .kpi-card.clickable{cursor:pointer;}
  .kpi-card.clickable:hover{border-color:var(--accent);}
  .photo-lightbox{
    position:fixed;inset:0;z-index:80;background:rgba(0,15,65,0.92);
    display:flex;align-items:center;justify-content:center;padding:56px 16px 16px;
  }
  .photo-lightbox img{
    max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .photo-lightbox .lb-close{
    position:absolute;top:12px;right:12px;min-width:44px;height:40px;padding:0 14px;
    border:none;border-radius:8px;background:#fff;color:var(--navy);
    font-size:15px;font-weight:700;cursor:pointer;z-index:81;
  }
  .photo-lightbox .lb-close:hover{background:var(--accent-soft);}
  .ver-stamp{font-size:10.5px;letter-spacing:0.04em;color:#8894BC;margin-top:8px;}
  .modal-foot-spacer{display:none;}

  /* ---- Lists page ---- */
  .lists-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .list-editor.wide{grid-column:1 / -1;}
  .list-editor h4.panel-toggle{font-size:15px;margin-bottom:10px;}
  .list-editor.is-collapsed{padding-top:14px;padding-bottom:14px;}
  .list-editor.is-collapsed h4.panel-toggle{margin-bottom:0;}
  .list-items{list-style:none;margin:0 0 10px 0;padding:0;}
  .list-items li{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 10px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;background:var(--surface);font-size:13px;
  }
  .list-items li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-items.names-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px;
  }
  .list-items.names-grid li{margin-bottom:0;}
  .list-items li.dealer-mail{flex-direction:column;align-items:stretch;gap:6px;}
  .dealer-mail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .dealer-mail-head span{font-weight:600;}
  .dealer-mails{font-size:12px;color:var(--ink-soft);word-break:break-word;}
  .dealer-mails em{font-style:normal;color:var(--ink-faint);}
  .dealer-mail .add-row input{font-size:12.5px;}
  .add-row{display:flex;gap:6px;}
  .add-row input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:13px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:#000F41;color:#fff;padding:11px 18px;border-radius:6px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    display:flex;align-items:center;gap:10px;max-width:min(520px,92vw);
    border:1px solid rgba(255,255,255,.14);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);pointer-events:auto;}
  .toast button{background:#fff;color:#000F41;border:none;border-radius:4px;padding:6px 10px;font-weight:700;font-size:12px;}
  html[data-theme="dark"] .toast{
    background:#F4F6FF;color:#070B18;border:1px solid #5B84EA;
    box-shadow:0 10px 28px rgba(0,0,0,.55);
  }
  html[data-theme="dark"] .toast button{background:#000F41;color:#fff;}
  .notify-bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);}
  .notify-bar.empty{display:none;}
  .notify-chip{border:none;background:var(--surface-alt);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
  .notify-chip.warn{background:#F8E3C4;color:#7A4A00;}
  .notify-chip.hot{background:#F6D4CF;color:var(--crit);}
  .notify-chip.ok{background:#DCE8DE;color:var(--barn);}
  .gsearch{position:relative;flex:1 1 180px;min-width:140px;max-width:360px;}
  .gsearch input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;}
  .gsearch-drop{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:320px;overflow:auto;margin-top:4px;}
  .gsearch-drop button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:10px 12px;font:inherit;cursor:pointer;border-bottom:1px solid var(--line);}
  .gsearch-drop button:hover{background:var(--accent-soft);}
  .gsearch-drop .k{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);}
  .pending-chip{background:#F8E3C4;color:#7A4A00;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:4px;}
  .c360-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .cal-panel{margin-bottom:14px;}
  .cal-nav{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
  .cal-nav h4{flex:1;text-align:center;margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;}
  .cal-cell{border:1px solid var(--line);border-radius:6px;min-height:88px;padding:6px;background:var(--surface);font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:stretch;}
  .cal-cell.today{border-color:var(--accent);background:var(--accent-soft);}
  .cal-cell.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .cal-cell.muted{opacity:.42;background:transparent;}
  .cal-cell.has-items{background:var(--surface);}
  .cal-pad{min-height:0;}
  .cal-day-add{
    display:flex;align-items:center;gap:4px;width:100%;
    padding:0 0 2px;min-height:22px;flex-shrink:0;
  }
  .cal-day-add > button{
    border:none;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0;text-align:left;
    display:inline-flex;align-items:center;gap:4px;min-height:22px;
  }
  .cal-day-add > button:first-child{flex:1;min-width:0;}
  .cal-day-add strong{font-size:12px;font-weight:800;}
  .cal-count{
    font-size:9px;font-weight:800;background:var(--accent);color:#fff;
    border-radius:999px;min-width:16px;padding:1px 5px;text-align:center;
  }
  .cal-add-hint{color:var(--ink-faint);font-weight:800;font-size:13px;margin-left:auto;line-height:1;}
  .cal-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;
    text-align:left;border:none;background:var(--accent-soft);color:var(--ink);
    padding:3px 5px;font:inherit;cursor:pointer;border-radius:4px;line-height:1.2;
    min-height:28px;position:relative;z-index:1;
  }
  .cal-item:hover{filter:brightness(1.08);}
  .cal-item-cust{font-weight:700;font-size:11px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-item-type{font-size:10px;opacity:.88;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 8px;font-size:11.5px;color:var(--ink-soft);}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px;}
  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0;}
  .cal-sources{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin:0 0 10px;font-size:12.5px;}
  .cal-sources > em{font-style:normal;font-weight:700;color:var(--ink-soft);margin-right:4px;}
  .cal-sources label{
    display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:3px 10px;
    border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface-alt);font-weight:600;
  }
  .cal-sources label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--navy);}
  .cal-sync-note{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .cal-agenda-row{border-left:4px solid var(--line);}
  .vt-color{
    width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;
    background:transparent;cursor:pointer;flex-shrink:0;
  }
  .cal-hd{font-size:10px;font-weight:800;color:var(--ink-faint);text-align:center;}
  .cal-agenda{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .cal-agenda-wrap{display:flex;gap:6px;align-items:stretch;}
  .cal-agenda-wrap .cal-agenda-row{flex:1;min-width:0;}
  .cal-gcal{align-self:center;flex-shrink:0;}
  .cal-agenda-row{
    display:grid;grid-template-columns:92px 1fr;gap:2px 10px;text-align:left;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);
    padding:10px 12px;font:inherit;cursor:pointer;color:var(--ink);width:100%;
  }
  .cal-agenda-row:hover{background:var(--accent-soft);border-color:var(--accent);}
  .cal-agenda-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cal-agenda-title{font-weight:700;font-size:13.5px;}
  .cal-agenda-sub{font-size:12px;color:var(--ink-soft);}
  .file-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .conflict-card{border:1px solid #E0A36A;background:#FFF6EE;color:#3A2412;border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .conflict-card strong{display:block;margin:0 0 4px;color:#7A3A10;font-size:14px;}
  .conflict-meta{font-size:13px;color:#5C4030;line-height:1.45;}
  .conflict-card .btn{background:#fff;color:#3A2412;border-color:#D9B08A;}
  .conflict-card .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  html[data-theme="dark"] .conflict-card{
    background:#2C1C12;border-color:#C67A3A;color:#F3E2D1;
  }
  html[data-theme="dark"] .conflict-card strong{color:#FFC48A;}
  html[data-theme="dark"] .conflict-meta{color:#E2C4A6;}
  html[data-theme="dark"] .conflict-card .btn{background:#3A2818;color:#F3E2D1;border-color:#C67A3A;}

  function readThemePref(){
    try{ var t = localStorage.getItem(THEME_KEY); }catch(e){ var t = null; }
    if(t==='light'||t==='dark'||t==='system') return t;

    pref = pref || readThemePref();

      '<button type="button" class="'+(pref==='system'?'on':'')+'" data-action="set-theme" data-theme="system">Auto</button>'+
      '</div>';

  function visitTypeKey(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

  function coerceRecordId(r){
    if(!r || r.id==null || r.id==='') return r;

  function issueFingerprint(r){
    return [normTitle(r && r.title), String((r && r.dateLogged)||''), String((r && r.loggedBy)||'')].join('|');

  function reconcileDuplicateIds(){
    if(!state.data) return 0;
    var issues = state.data.issues || [];
    var archive = state.data.archive || [];
    var changed = 0;
    issues.forEach(coerceRecordId);
    archive.forEach(coerceRecordId);
    (state.data.tasks||[]).forEach(coerceRecordId);

    var byFp = {};
    var keepIssues = [];
    issues.forEach(function(r){
      if(!r) return;
      var fp = issueFingerprint(r);
      if(fp==='||'){ keepIssues.push(r); return; }
      var prev = byFp[fp];
      if(!prev){ byFp[fp] = r; keepIssues.push(r); return; }
      var keepNew = (parseInt(r.id,10)||0) < (parseInt(prev.id,10)||0);
      if(keepNew){
        keepIssues = keepIssues.filter(function(x){ return x!==prev; });
        keepIssues.push(r);
        byFp[fp] = r;
      }
      changed++;
    });

    var archById = {};
    archive.forEach(function(r, i){ if(r && r.id!=null) archById[String(r.id)] = i; });
    var finalIssues = [];
    keepIssues.forEach(function(r){
      if(!r || r.id==null || !(String(r.id) in archById)){ finalIssues.push(r); return; }
      var a = archive[archById[String(r.id)]];
      if(normTitle(r.title) !== normTitle(a.title)){ finalIssues.push(r); return; }
      var rt = Date.parse(r.updatedAt || r.lastUpdated || '') || 0;
      var at = Date.parse(a.updatedAt || a.lastUpdated || a.archivedDate || '') || 0;
      if(rt >= at){
        archive.splice(archById[String(r.id)], 1);
        archById = {};
        archive.forEach(function(x, i){ if(x && x.id!=null) archById[String(x.id)] = i; });
        finalIssues.push(r);
      }
      changed++;
    });
    if(changed){
      state.data.issues = finalIssues;
      state.data.archive = archive;
    }
    return changed;
  }

  function runScheduledMails(){
    if(!state.data || !state.session) return;
    if(dublinHour() < 8) return;
    var day = dublinWeekday();
    if(day==='Sat' || day==='Sun') return;
    var meta = state.data.mailMeta = state.data.mailMeta || {};
    var today = todayStr();
    var dirty = false;
    if(meta.lastDailyBackup !== today){
      if(queueDailyBackup()){ meta.lastDailyBackup = today; dirty = true; }
      else meta.lastDailyBackup = today;
    }
    var lastF = String(meta.lastFortnightDigest||'');
    var gap = lastF ? daysBetween(lastF, today) : 99;
    if(gap===null || gap >= 14){
      if(queueFortnightDigest()){ meta.lastFortnightDigest = today; dirty = true; }
      else if(!lastF) meta.lastFortnightDigest = today;
    }
    if(meta.lastReminders !== today){
      queueWeekBeforeMails();
      queueOverdueMails();
      queueArchiveNudge();
      meta.lastReminders = today;
      dirty = true;
    }
    if(dirty) saveData();
  }

    items.forEach(function(it){

      var start = String(it.date).replace(/-/g,'');
      var end = nextYmd(it.date).replace(/-/g,'');
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+uid);
      lines.push('DTSTAMP:'+start+'T080000Z');
      lines.push('DTSTART;VALUE=DATE:'+start);
      lines.push('DTEND;VALUE=DATE:'+end);
      lines.push('SUMMARY:'+icsEscape('FTTech · '+(it.title||'')+' — '+(it.sub||'')));

      state.data.devices.push(rec);
      fromActivity = true;
    }
    var viewChanged = rec.view && rec.view !== prevView;
    var cut = now - 60*24*3600*1000;
    state.data.devices = state.data.devices.filter(function(d){
      var t = Math.max(Date.parse(d.lastSeen||"")||0, Date.parse(d.lastActivity||"")||0);
      return t >= cut;

    (state.data.users||[]).forEach(function(u){
      if(!u || !u.name || seen[u.name]) return;
      seen[u.name] = 1;
      names.push(u.name);
    });
    ((state.data.lists||{}).teamMembers||[]).forEach(function(n){
      if(!n || seen[n]) return;
      seen[n] = 1;
      names.push(n);
    });
    return names;
  }
  function defaultHerdManager(){
    var names = assignableUserNames();

  function doLogin(){
    var nameEl = document.getElementById("login-name");
    var passEl = document.getElementById("login-pass");
    var rememberEl = document.getElementById("login-remember");
    var name = nameEl ? nameEl.value : "";
    var pass = passEl ? passEl.value : "";
    var remember = rememberEl ? !!rememberEl.checked : true;
    if(!name){ state.loginError = "Select your name"; render(); return; }
    var user = findUser(name);
    if(!user){ state.loginError = "Unknown user"; render(); return; }
    if(user.mustSetPassword || !user.hash){
      if(!pass || pass.length < 6){ state.loginError = "Choose a password of at least 6 characters"; render(); return; }
      var salt = randomSalt();
      hashPassword(pass, salt).then(function(h){
        user.salt = salt;
        user.hash = h;
        user.mustSetPassword = false;
        state.session = {name:user.name, role:user.role, remember:remember};
        persistSession();
        state.loginError = "";
        audit("first-login", user.name + " set password (" + user.role + ")");
        heartbeatDevice(true);
        saveData();
        render();
      });
      return;
    }
    if(!pass){ state.loginError = "Enter your password"; render(); return; }
    hashPassword(pass, user.salt || "").then(function(h){
      if(h !== user.hash){
        state.loginError = "Wrong password";
        render();
        return;
      }
      state.session = {name:user.name, role:user.role, remember:remember};
      persistSession();
      state.loginError = "";
      audit("login", user.name);
      heartbeatDevice(true);
      saveData();
      render();
    });
  }

  function render(){
    var app = document.getElementById("app");
    if(isRaiseMode()){
      try{
        canonicaliseRaiseUrl();
        document.title = 'Raise an issue — GEA FT Ireland';
        app.innerHTML = renderDealerRaise();
        attachHandlers();
        var rf = document.getElementById('raise-form');
        if(rf) rf.addEventListener('submit', function(e){ e.preventDefault(); submitDealerRaise(); });
        if(state.data && !state.loading) wireRaiseForm();
      }catch(err){
        console.error(err);
        app.innerHTML = '<div class="login-screen"><div class="login-card raise-card"><h1>Raise an issue</h1><p class="hint">Loading the form…</p><button type="button" class="btn btn-primary" style="width:100%;justify-content:center;" onclick="location.reload()">Refresh</button></div></div>';
      }
      return;
    }
    document.title = 'GEA FT Ireland — FTTechApp';
    if(state.loading){
      app.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div>Connecting to live workspace…</div></div>';
      return;
    }
    if(state.needSetup && !getSbKey()){
      app.innerHTML = renderSetup();
      attachHandlers();
      return;
    }
    if(!state.session){
      app.innerHTML = renderLogin();
      attachHandlers();
      var pass = document.getElementById("login-pass");
      if(pass) pass.addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
      return;
    }
    stashModalForm();
    var html = '';
    html += renderSidebar();
    html += '<div class="sidebar-backdrop'+(state.sidebarOpen?' show':'')+'" data-action="close-sidebar"></div>';
    if(state.view==="audit" && !isAdmin()) state.view="dashboard";
    html += '<div class="main view-'+state.view+'">';
    html += renderTopbar();
    html += '<div class="content">';
    if(state.view==="dashboard") html += renderDashboard();
    else if(state.view==="overview") html += canSeeStaffPages() ? renderOverview() : '<div class="panel">Admin only</div>';
    else if(state.view==="issues") html += renderTable("issues");
    else if(state.view==="tasks") html += renderTable("tasks");
    else if(state.view==="archive") html += renderArchive();
    else if(state.view==="installs") html += renderInstalls();
    else if(state.view==="visits") html += renderVisits();
    else if(state.view==="customers") html += renderCustomer360();
    else if(state.view==="lists") html += canSeeStaffPages() ? renderLists() : '<div class="panel">Admin only</div>';
    else if(state.view==="users") html += renderUsers();
    else if(state.view==="audit") html += renderAudit();
    html += '</div></div>';
    html += renderBottomNav();
    app.innerHTML = html;
    try{
      document.querySelectorAll('.modal-overlay').forEach(function(el){ el.remove(); });
      document.body.classList.toggle('modal-open', !!state.modal);
      document.documentElement.classList.toggle('modal-open', !!state.modal);
      if(state.modal){
        if(state.modal.type==='details') renderDetailsModal();
        else if(state.modal.type==='followup'){
          var fu = document.createElement('div');
          fu.innerHTML = renderFollowUpModal();
          if(fu.firstChild) document.body.appendChild(fu.firstChild);
        }
        else if(state.modal.type==='add-time'){
          var tm = document.createElement('div');
          tm.innerHTML = renderTimeModal();
          if(tm.firstChild) document.body.appendChild(tm.firstChild);
          wireTimeModal();
        }
        else if(state.modal.type==='add-note'){
          var nm = document.createElement('div');
          nm.innerHTML = renderNoteModal();
          if(nm.firstChild) document.body.appendChild(nm.firstChild);
          wireNoteModal();
        }
        else if(state.modal.type==='close-email'){
          var ce = document.createElement('div');
          ce.innerHTML = renderCloseEmailModal();
          if(ce.firstChild) document.body.appendChild(ce.firstChild);
          wireCloseEmailModal();
        }
        else if(state.modal.type==='share-email'){
          var se = document.createElement('div');
          se.innerHTML = renderShareEmailModal();
          if(se.firstChild) document.body.appendChild(se.firstChild);
          wireShareEmailModal();
        }
        else if(state.modal.type==='issueview') renderIssueViewModal();
        else if(state.modal.type==='export-backup') renderExportModal();
        else if(state.modal.type==='import-backup') renderImportModal();
        else if(state.modal.type==='check-customer') renderCheckCustomerModal();
        else if(state.modal.type==='next-visit'){
          var nv = document.createElement('div');
          nv.innerHTML = renderNextVisitModal();
          if(nv.firstChild) document.body.appendChild(nv.firstChild);
        }
        else renderModal();
      }
    }catch(err){
      console.error(err);
      showToast('Could not open that window');
    }
    attachHandlers();
    if(state.expanded && (state.view==='issues' || state.view==='tasks' || state.view==='visits' || state.view==='archive')){
      setTimeout(function(){
        var el = document.querySelector('.issue-row.is-open');
        if(el && el.scrollIntoView) el.scrollIntoView({block:'start', behavior:'smooth'});
      }, 60);
    }
  }

      else if(!email && String(p.name||'').toLowerCase()===name.toLowerCase()) idx = i;
    });
    var changed = false;
    if(idx>=0){
      var prev = list[idx];
      if(name && prev.name !== name){ prev.name = name; changed = true; }
      if(email && prev.email !== email){ prev.email = email; changed = true; }
      if(!quiet){
        prev.lastUsed = nowIso();

        list.unshift(prev);
        changed = true;

    } else {
      list.unshift({name:name, email:email, lastUsed: nowIso()});

  function customerIssueStats(name){
    name = canonicalCustomer(name || "").toLowerCase();
    var stats = {open:0, high:0, all:0, openList:[], highList:[]};
    if(!name) return stats;
    (state.data.issues||[]).forEach(function(r){
      if(customerName(r).toLowerCase()!==name) return;
      stats.all++;
      var closed = isClosedStatus(r.status);
      if(!closed){
        stats.open++;
        stats.openList.push(r);
        var pr = String(r.priority||"").toLowerCase();
        if(pr==="high" || pr==="critical"){
          stats.high++;
          stats.highList.push(r);
        }
      }
    });
    stats.openList.sort(function(a,b){
      var pa = String(a.priority||"");
      var pb = String(b.priority||"");
      var rank = {Critical:0, High:1, Medium:2, Low:3};
      return (rank[pa]||9) - (rank[pb]||9);
    });
    return stats;
  }
  function customerIssueRisk(stats){
    if(!stats) return "";

  function isIssueRecord(r){

    if(r.recordType==='task' || r.recordType==='visit' || r.recordType==='install') return false;
    if(r.recordType==='issue') return true;
    if(isVisitRecord(r)) return false;
    if(r.dealership || r.product) return true;
    if(r.category && !r.dealership) return false;
    return true;
  }
  function visitStatusOptions(){ return ["Open","Follow-up","Closed"]; }
  function isClosedStatus(s){
    s = String(s||'').toLowerCase();
    return s==='resolved' || s==='closed' || s==='done';
  }
  function becameClosedStatus(prev, next){
    return !isClosedStatus(prev) && isClosedStatus(next);
  }
  function uniqueIssues(d){
    var map = {};
    (d.archive||[]).concat(d.issues||[]).forEach(function(r){
      if(!isIssueRecord(r) || r.id==null) return;
      var prev = map[r.id];
      if(!prev){ map[r.id] = r; return; }
      var a = Date.parse(r.updatedAt||r.lastUpdated||r.archivedDate||'')||0;
      var b = Date.parse(prev.updatedAt||prev.lastUpdated||prev.archivedDate||'')||0;
      if(a>=b) map[r.id] = r;
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }
  function resolveDate(r){
    return r.archivedDate || r.lastUpdated || (r.updatedAt||'').slice(0,10) || r.dateLogged;
  }
  
  function allRecords(){
    return (state.data.issues||[]).concat(state.data.tasks||[]).concat(state.data.archive||[]);
  }
  function monthKey(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }
  function inLastDays(iso, days){
    var t = Date.parse(iso||"");
    if(isNaN(t)) return false;
    return (Date.now()-t) <= days*24*60*60*1000;
  }
  function lastNoteIso(r){
    var last = '';
    (r.updates||[]).forEach(function(u){
      var d = String(u.date||u.at||'');
      if(d>last) last=d;
    });
    if(!last) last = String(r.updatedAt||r.lastUpdated||r.dateLogged||r.visitDate||'');
    return last;
  }
  function isStaleRecord(r, days){
    var last = lastNoteIso(r);
    if(!last) return true;
    return !inLastDays(last, days);
  }
  function userLastActivity(name){
    var latest = 0;
    allRecords().forEach(function(r){
      if((r.loggedBy||"")===name || (r.assignee||"")===name){
        var t = Date.parse(r.updatedAt||r.lastUpdated||r.archivedDate||r.dateLogged||"")||0;
        if(t>latest) latest=t;
      }
      (r.updates||[]).concat(r.followUps||[]).concat(r.timeEntries||[]).forEach(function(x){
        if((x.author||"")!==name) return;
        var t = Date.parse(x.date||x.at||x.updatedAt||"")||0;
        if(t>latest) latest=t;
      });
    });
    return latest||null;
  }
  function hoursByAuthor(name, days){
    var sum=0;
    allRecords().forEach(function(r){
      (r.timeEntries||[]).forEach(function(e){
        if((e.author||"")!==name) return;
        if(days && !inLastDays(e.date||e.at, days)) return;
        sum += parseFloat(e.hours)||0;
      });
    });
    return Math.round(sum*10)/10;
  }
  
  
  function ymAdd(n){
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }
  function dealerHoursPanel(){

    var toM = ov.to || mk;

    var map = {};
    function row(name){
      if(!map[name]) map[name] = {ytd:0, prior:0, month:0, l12:0, range:0};
      return map[name];
    }
    issues.forEach(function(r){
      if(!r.dealership) return;
      (r.timeEntries||[]).forEach(function(e){

        if(ym.length<7) return;
        var rec = row(r.dealership);
        if(ym.slice(0,4)===year && ym<=mk) rec.ytd += h;
        if(ym.slice(0,4)===year && ym<mk) rec.prior += h;
        if(ym===mk) rec.month += h;
        if(ym>=l12start && ym<=mk) rec.l12 += h;
        if(ym>=fromM && ym<=toM) rec.range += h;
      });
    });
    function rnd(n){ return Math.round((n||0)*10)/10; }
    var names = Object.keys(map).sort(function(a,b){ return map[b].ytd-map[a].ytd; });
    var tot = {ytd:0, prior:0, month:0, l12:0, range:0};
    names.forEach(function(n){

    });
    var totAvg = completed ? rnd(tot.prior/completed) : 0;

    }).join('') : '<div class="empty-state" style="padding:20px;">No hours logged</div>';

    return '<div class="panel"><h3>Hours by dealership</h3>'+
      '<div class="hrs-kpis four">'+
        '<div><div class="label">Year to date</div><div class="value">'+rnd(tot.ytd)+'h</div></div>'+
        '<div><div class="label">Avg / month</div><div class="value">'+(completed?totAvg+'h':'—')+'</div><div class="label" style="margin-top:4px;text-transform:none;letter-spacing:0;">YTD excl. this month</div></div>'+
        '<div><div class="label">This month</div><div class="value">'+rnd(tot.month)+'h</div></div>'+
        '<div><div class="label">L12M</div><div class="value">'+rnd(tot.l12)+'h</div><div class="label" style="margin-top:4px;text-transform:none;letter-spacing:0;">Last 12 months</div></div>'+
      '</div>'+
      '<div class="hrs-range">'+
        '<label>From <input type="month" data-filter="from" data-kind="overview" value="'+esc(fromM)+'"></label>'+
        '<label>To <input type="month" data-filter="to" data-kind="overview" value="'+esc(toM)+'"></label>'+

        '<div class="hrs-cols wide"><span>YTD</span><span>Avg/mo</span><span>Month</span><span>L12M</span><span>Range</span></div></div>'+

      return String(a.name).localeCompare(String(b.name));
    });

  function renderTeamUsagePanel(){

    });

  function dashHubButtons(info, hub, opts){
    opts = opts || {};
    var action = opts.action || 'dash-hub';
    var kicker = opts.kicker || 'Open dashboard';
    function chips(arr){
      return '<span class="dh-meta">'+(arr||[]).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('')+'</span>';
    }
    function card(key, title, countLabel, n, chipArr, listLabel, extraCounts){
      var block = info[key] || {n:0, chips:[]};
      extraCounts = extraCounts || block.extraCounts || [];
      var countHtml = '<span class="dh-count">'+(n!=null?n:block.n)+'<span>'+esc(countLabel||'')+'</span></span>';
      extraCounts.forEach(function(c){
        countHtml += '<span class="dh-count">'+(c.n!=null?c.n:0)+'<span>'+esc(c.label||'')+'</span></span>';
      });
      return '<article class="dash-hub'+(hub===key?' on':'')+'">'+
        '<button type="button" class="dh-main" data-action="'+action+'" data-hub="'+key+'">'+
          '<span class="dh-kicker">'+kicker+'</span>'+
          '<span class="dh-title">'+title+'</span>'+
          '<span class="dh-counts">'+countHtml+'</span>'+
          chips(chipArr || block.chips)+
        '</button>'+
        (listLabel ? '<button type="button" class="dh-list" data-nav="'+key+'">'+listLabel+'</button>' : '')+
      '</article>';
    }

  function stackedBarPanel(title, openObj, closedObj, filterType){
    var keys = {};
    Object.keys(openObj||{}).forEach(function(k){ keys[k]=1; });
    Object.keys(closedObj||{}).forEach(function(k){ keys[k]=1; });
    var entries = Object.keys(keys).map(function(k){
      var o = openObj[k]||0, c = closedObj[k]||0;
      return [k, o, c, o+c];
    }).sort(function(a,b){ return b[3]-a[3]; });
    var totOpen = entries.reduce(function(s,e){ return s+e[1]; }, 0);
    var totClosed = entries.reduce(function(s,e){ return s+e[2]; }, 0);
    var totAll = totOpen + totClosed;
    var max = entries.reduce(function(m,e){ return Math.max(m,e[3]); }, 0) || 1;
    var rows = entries.length ? entries.map(function(e){
      var oPct = Math.round((e[1]/max)*100);
      var cPct = Math.round((e[2]/max)*100);
      var clickAttrs = filterType ? ' class="bar-row clickable-bar" data-action="dashboard-filter" data-filter-type="'+filterType+'" data-filter-value="'+esc(e[0])+'"' : ' class="bar-row"';
      return '<div'+clickAttrs+'><div class="bar-label" title="'+esc(e[0])+'">'+esc(e[0])+'</div>'+
        '<div class="bar-track"><div class="bar-fill open" style="width:'+oPct+'%"></div><div class="bar-fill closed" style="width:'+cPct+'%"></div></div>'+
        '<span class="bar-split" title="'+e[3]+' total · '+e[1]+' open · '+e[2]+' closed">'+
          '<span class="tot">'+e[3]+'</span>'+
          '<span class="oc">'+e[1]+' open · '+e[2]+' closed</span></span></div>';
    }).join('') : '<div class="empty-state" style="padding:20px;">No data yet</div>';
    var key = filterType ? ('stacked-'+filterType) : title;
    return collapsiblePanel(key, title,
      '<div class="bar-legend"><span><i style="background:var(--steel)"></i>Open</span><span><i style="background:#8A8F87"></i>Closed</span><span class="bar-legend-tot">'+totAll+' total</span></div>'+rows,
      totAll+' · '+totOpen+' open · '+totClosed+' closed'
    );
  }
  function dealerProductPanel(tree){
    function sums(map){
      var o=0, c=0;
      Object.keys(map||{}).forEach(function(k){
        o += (map[k] && map[k].open) || 0;
        c += (map[k] && map[k].closed) || 0;
      });
      return {open:o, closed:c, total:o+c};
    }
    var dealers = Object.keys(tree||{}).sort(function(a,b){ return sums(tree[b]).total - sums(tree[a]).total; });
    var grand = {open:0, closed:0, total:0};
    dealers.forEach(function(d){
      var s = sums(tree[d]);
      grand.open += s.open; grand.closed += s.closed; grand.total += s.total;
    });
    if(!dealers.length){
      return '<div class="panel"><h3>Issues by dealership / product</h3><div class="empty-state" style="padding:20px;">No issues</div></div>';
    }
    var rows = dealers.map(function(dealer){
      var products = Object.keys(tree[dealer]).sort(function(a,b){
        var ta = ((tree[dealer][a].open||0)+(tree[dealer][a].closed||0));
        var tb = ((tree[dealer][b].open||0)+(tree[dealer][b].closed||0));
        return tb-ta;
      });
      var s = sums(tree[dealer]);
      var open = !!(state.expandedDealers && state.expandedDealers[dealer]);
      var body = products.map(function(p){
        var cell = tree[dealer][p] || {open:0, closed:0};
        var tot = (cell.open||0)+(cell.closed||0);
        return '<button type="button" class="dxp-prod" data-action="dashboard-filter" data-filter-type="dealership" data-filter-value="'+esc(dealer)+'" data-also-product="'+esc(p)+'">'+
          '<span>'+esc(p)+'</span>'+
          '<span class="n">'+tot+' <span class="oc">'+(cell.open||0)+' open · '+(cell.closed||0)+' closed</span></span></button>';
      }).join('');
      return '<div class="dxp-row">'+
        '<button type="button" class="dxp-head" data-action="toggle-dealer-row" data-dealer="'+esc(dealer)+'">'+
          '<span class="dxp-name">'+(open?'▾ ':'▸ ')+esc(dealer)+'</span>'+
          '<span class="dxp-count"><b>'+s.total+'</b> · '+s.open+' open · '+s.closed+' closed</span></button>'+
        (open ? '<div class="dxp-body">'+body+'</div>' : '')+
      '</div>';
    }).join('');
    return collapsiblePanel('open-dealer-product', 'Issues by dealership / product',
      '<p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;">Tap a dealership to expand products. Each line shows total count plus the open / closed split. Tap a product to open that filtered list.</p>'+rows,
      grand.total+' · '+grand.open+' open · '+grand.closed+' closed'
    );
  }
  function barPanel(title, dataObj, fixedColor, colorFn, filterType, collapseKey){

    var max = entries.reduce(function(m,e){return Math.max(m,e[1]);}, 0) || 1;

      var clickAttrs = filterType ? ' class="bar-row clickable-bar" data-action="dashboard-filter" data-filter-type="'+filterType+'" data-filter-value="'+esc(e[0])+'"' : ' class="bar-row"';
      return '<div'+clickAttrs+'><div class="bar-label" title="'+esc(e[0])+'">'+esc(e[0])+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
        '<div class="bar-val">'+e[1]+'</div></div>';

  function submitFollowUp(containerEl){
    var overlay = document.querySelector('.modal-overlay');
    var box = (overlay && overlay.querySelector('.modal')) || (containerEl && containerEl.querySelector && containerEl.querySelector('.modal')) || containerEl;
    var fd = readFields(box);
    var note = (fd.get('followNote')||'').trim();
    var person = fd.get('followPerson');
    var status = fd.get('followStatus');
    if(!note || !person || !status){ showToast('Fill in description, person and status'); return; }
    var kind = (state.modal && state.modal.kind) || 'issue';
    var found = findRecord(kind, state.modal.id);
    var r = found ? found.record : null;
    if(!r){ showToast('Record not found'); return; }
    var oldStatus = r.status;
    r.followUps = r.followUps || [];
    r.followUps.push({date: todayStr(), author: person, text: note, fromStatus: r.status, toStatus: status, followUpDate: r.followUpDate||''});
    r.updates = r.updates || [];
    r.updates.push({date: todayStr(), author: person, text: 'Follow-up done ('+fmtDate(r.followUpDate)+'): '+note});

  function autoNotifyDealership(kind, r, reason){
    if(!canWrite() || !r) return 0;
    if(reason==='hours') return 0;
    var dealer = (r.dealership||'').trim();
    var toTech = !!(kind==='issue' && r.source==='dealer');
    var list = (kind==='issue') ? issueUpdateRecipients(r) : emailsReadyForDealership(dealer).slice();
    if(kind!=='issue' && list.length){
      var tech = technicianEmailSet();
      list = list.filter(function(e){ return !tech[String(e||'').toLowerCase()]; });
    }
    if(!list.length){
      if(toTech && !String(r.reporterEmail||'').trim()) return 0;
      dealerNotifyToast(kind, 0, toTech ? 0 : (dealer || true), toTech);
      return 0;
    }
    var n = 0;
    if(kind==='issue') n = queueDealerIssueEmails(r, list, reason||'updated');
    else if(kind==='visit') n = queueDealerVisitEmails(r, list, reason||'updated');
    else if(kind==='install') n = queueDealerInstallEmails(r, list, reason||'updated');
    if(n){
      audit('dealer-email', (kind||'')+' #'+r.id+' '+(reason||'updated')+' → '+list.join(', '));
      saveData();
    }
    dealerNotifyToast(kind, n, 0, toTech);

    var r = list[idx];
    pushUndoArchive('issue', r);
    if(!isClosedStatus(r.status)) r.status = 'Closed';
    var archived = Object.assign({}, r, {recordType:'issue', archivedDate: r.archivedDate || todayStr()});
    state.data.archive = state.data.archive || [];
    var already = state.data.archive.some(function(a){ return Number(a.id)===id && a.recordType==='issue'; });

    list.splice(idx,1);

    return true;

      var settled = false;
      function done(uri, err){
        if(settled) return;
        settled = true;
        if(err || !uri) reject(err || new Error('pdf failed'));
        else resolve(uri);
      }
      setTimeout(function(){ done('', new Error('pdf timeout')); }, 20000);
      withHtml2Pdf(function(){
        if(!window.html2pdf){ done('', new Error('no html2pdf')); return; }
        var wrap = document.createElement('div');
        wrap.style.position = 'fixed';
        wrap.style.left = '-10000px';
        wrap.innerHTML = html;
        document.body.appendChild(wrap);
        var job;
        try {
          job = window.html2pdf().set({
            margin: 8,
            filename: filename,
            image: {type:'jpeg', quality:0.92},
            html2canvas: {scale:1.4, useCORS:true},
            jsPDF: {unit:'mm', format:'a4', orientation:'portrait'}
          }).from(wrap.firstChild);
        } catch(err){
          try{ document.body.removeChild(wrap); }catch(e){}
          done('', err);
          return;
        }
        function asDataUrl(val){
          if(!val) return Promise.reject(new Error('empty pdf'));
          if(typeof val.then === 'function') return val.then(asDataUrl);
          if(typeof val === 'string' && val.indexOf('data:')===0) return Promise.resolve(val);
          if(typeof Blob !== 'undefined' && val instanceof Blob){
            return new Promise(function(res, rej){
              var rd = new FileReader();
              rd.onload = function(){ res(rd.result); };
              rd.onerror = function(){ rej(new Error('read pdf')); };
              rd.readAsDataURL(val);
            });
          }
          return Promise.reject(new Error('bad pdf'));
        }
        var out = null;
        try { out = job.outputPdf('datauristring'); } catch(err2){ out = null; }
        if(!out){ try { out = job.outputPdf('blob'); } catch(err3){ out = null; } }
        asDataUrl(out).then(function(uri){
          try{ document.body.removeChild(wrap); }catch(e){}
          done(uri);
        }).catch(function(err){
          try{ document.body.removeChild(wrap); }catch(e){}
          done('', err);
        });
      }, function(){ done('', new Error('html2pdf load failed')); });
    });
  }

    else if(mode==='dealership') n = String(a.dealership||'').localeCompare(String(b.dealership||''), undefined, {sensitivity:'base'});
    else if(mode==='customer') n = String(customerName(a)||'').localeCompare(String(customerName(b)||''), undefined, {sensitivity:'base'});
    else if(mode==='product') n = String(a.product||'').localeCompare(String(b.product||''), undefined, {sensitivity:'base'});
    else if(mode==='priority'){
      var ai=pri.indexOf(a.priority), bi=pri.indexOf(b.priority);
      n = (ai<0?99:ai) - (bi<0?99:bi);
    }
    else if(mode==='status') n = String(a.status||'').localeCompare(String(b.status||''), undefined, {sensitivity:'base'});
    else if(mode==='title') n = String(a.title||'').localeCompare(String(b.title||''), undefined, {sensitivity:'base'});
    else if(mode==='loggedBy' || mode==='owner') n = String(a.loggedBy||a.assignee||'').localeCompare(String(b.loggedBy||b.assignee||''), undefined, {sensitivity:'base'});
    else if(mode==='followup'){
      var ad=a.followUpDate||'', bd=b.followUpDate||'';
      if(!ad && !bd) n = 0;
      else if(!ad) n = 1;
      else if(!bd) n = -1;
      else n = ad.localeCompare(bd);
    }
    else if(mode==='archived') n = String(a.archivedDate||resolveDate(a)||'').localeCompare(String(b.archivedDate||resolveDate(b)||''));
    else if(mode==='type') n = String(a.recordType||'').localeCompare(String(b.recordType||''));
    else if(mode==='hours') n = totalHours(a) - totalHours(b);
    else if(mode==='recent') n = recencyTs(a) - recencyTs(b);
    else n = recencyTs(a) - recencyTs(b);
    if(!n) n = (parseInt(a.id,10)||0) - (parseInt(b.id,10)||0);
    return n * m;
  }

  function ageInDays(dateStr){
    if(!dateStr) return null;
    var d = new Date(dateStr+"T00:00:00");
    if(isNaN(d)) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    return Math.round((today-d)/86400000);
  }
  function daysBetween(startStr, endStr){
    if(!startStr || !endStr) return null;
    var a = new Date(startStr+"T00:00:00");
    var b = new Date(endStr+"T00:00:00");
    if(isNaN(a)||isNaN(b)) return null;
    return Math.max(0, Math.round((b-a)/86400000));
  }
  function resolutionBadge(startStr, endStr){
    var days = daysBetween(startStr, endStr);
    if(days===null) return '<span style="color:var(--ink-faint);font-size:12.5px;">—</span>';
    return '<span style="color:'+ageColor(days)+';font-weight:700;font-size:12.5px;">'+days+' day'+(days===1?'':'s')+'</span>';
  }
  function ageColor(days){
    if(days===null) return "var(--ink-faint)";
    if(days<7) return "var(--st-resolved)";
    if(days<30) return "var(--med)";
    return "var(--overdue)";
  }
  function ageBadge(dateStr){
    var days = ageInDays(dateStr);
    if(days===null) return '<span style="color:var(--ink-faint);font-size:12.5px;">—</span>';
    return '<span style="color:'+ageColor(days)+';font-weight:700;font-size:12.5px;">'+days+'d</span>';
  }
  function latestUpdate(r){

  function hoursOptions(val){

  function isOverdue(t){
    if(!t.dueDate || t.status==='Done') return false;
    var due = new Date(t.dueDate+"T00:00:00");
    var today = new Date(); today.setHours(0,0,0,0);
    return due < today;
  }
  function isDueThisWeek(t){
    if(!t.dueDate || t.status==='Done') return false;
    var due = new Date(t.dueDate+"T00:00:00");
    var today = new Date(); today.setHours(0,0,0,0);
    var weekOut = new Date(today); weekOut.setDate(weekOut.getDate()+7);
    return due >= today && due <= weekOut;
  }
  function renderTaskTable(){

      if(f.blocked && !r.blocked) return false;

    }).sort(function(a,b){
      var da = a.dueDate ? new Date(a.dueDate) : new Date(8640000000000000);

  // ---------- Archive ----------
  function renderArchive(){
    var d = state.data;
    var f = state.filters.archive;
    var records = (d.archive||[]).slice();
    if(f.month){
      (d.issues||[]).forEach(function(r){
        if(!isClosedStatus(r.status)) return;
        var key = (resolveDate(r)||'').slice(0,7);
        if(key!==f.month) return;
        var clone = Object.assign({}, r, {recordType:'issue', archivedDate: r.archivedDate || resolveDate(r)});
        records.push(clone);
      });
    }
    records = records.filter(function(r){
      if(f.q){
        var hay = ((r.title||'')+' '+(r.description||'')+' '+(r.customer||'')+' '+(r.notes||'')+' '+updatesSearchText(r)+' '+(r.loggedBy||'')+' '+(r.customerInfo||'')).toLowerCase();
        if(hay.indexOf(f.q.toLowerCase())===-1) return false;
      }
      if(f.type && r.recordType!==f.type) return false;
      if(f.dealership && r.dealership!==f.dealership) return false;
      if(f.product && !issueHasProduct(r, f.product)) return false;
      if(f.month){
        var mk = (r.archivedDate || resolveDate(r) || '').slice(0,7);
        if(mk!==f.month) return false;
        if(!isIssueRecord(r) && r.recordType!=='issue') return false;
      }
      return true;
    });
    records = sortArchiveRecords(records, f.sort || 'archived', f.sortDir || 'desc');

    var html = '';
    html += '<div class="toolbar">';
    html += '<input type="text" class="search" placeholder="Search archive…" data-filter="q" data-kind="archive" value="'+esc(f.q)+'">';
    html += '<select data-filter="type" data-kind="archive"><option value="">All types</option><option value="issue"'+(f.type==='issue'?' selected':'')+'>Issues</option><option value="task"'+(f.type==='task'?' selected':'')+'>Tasks</option><option value="visit"'+(f.type==='visit'?' selected':'')+'>Herd</option></select>';
    html += selectFilter("archive","dealership", d.lists.dealerships, f.dealership, "All dealerships");
    html += selectFilter("archive","product", d.lists.products, f.product, "All products");
    html += '<label class="sort-label">Sort <select data-filter="sort" data-kind="archive">'+
      '<option value="archived"'+((f.sort||'archived')==='archived'?' selected':'')+'>Date archived</option>'+
      '<option value="logged"'+(f.sort==='logged'?' selected':'')+'>Date logged</option>'+
      '<option value="title"'+(f.sort==='title'?' selected':'')+'>Title</option>'+
      '</select></label>';
    html += '<button class="btn btn-sm" data-action="reset-sort" data-kind="archive">Newest archived first</button>';
    if(canWrite()) html += '<button class="btn btn-sm" data-action="open-export-pack">Export PDF pack</button>';
    html += '</div>';
    if(f.month) html += '<div class="banner-note" style="border-color:var(--accent);">Showing issues resolved in '+esc(f.month)+'. <button class="btn btn-sm" data-action="clear-archive-month">Show all archive</button></div>';

    if(!records.length){
      html += '<div class="table-wrap"><div class="empty-state"><h4>Archive is empty</h4>Resolved or closed records will land here.</div></div>';
      return html;
    }

    html += '<div class="compact-list">';
    records.forEach(function(r){
      if(isVisitRecord(r) || r.recordType==='visit') html += compactVisitRow(r, {archived:true});
      else {
        var isIssue = isIssueRecord(r) || r.recordType==='issue';
        html += isIssue ? compactIssueRow(r, {archived:true}) : compactTaskRow(r, {archived:true});
      }
    });
    html += '</div>';
    return html;
  }

  function sortInstalls(list, mode, dir){
    var copy = (list||[]).slice();
    var mul = dir==='desc' ? -1 : 1;
    copy.sort(function(a,b){
      var ka, kb;
      if(mode==='launchpad'){
        ka = a.launchpadDate || '';
        kb = b.launchpadDate || '';
      } else {
        ka = a.deliveryDate || '';
        kb = b.deliveryDate || '';
      }
      if(!ka && !kb) return (parseInt(a.id,10)||0) - (parseInt(b.id,10)||0);
      if(!ka) return 1;
      if(!kb) return -1;
      var n = ka.localeCompare(kb);
      if(!n) n = String(a.customer||'').localeCompare(String(b.customer||''), undefined, {sensitivity:'base'});
      if(!n) n = (parseInt(a.id,10)||0) - (parseInt(b.id,10)||0);
      return n * mul;
    });
    return copy;
  }

  function renderHerdDesk(d){
    var me = currentName();
    var visits = d.visits || [];
    var mine = visits.filter(function(r){ return !r.herdManager || r.herdManager===me; });
    var upcomingVisits = mine.filter(function(r){ return inNextDays(r.visitDate, 14) && !isClosedStatus(r.status); });
    var upcomingInstalls = (d.installs||[]).filter(function(r){
      return r.herdManager===me && (inNextDays(r.herdHealthDate, 14) || inNextDays(r.deliveryDate, 14));
    });
    var show = isHerdManagerUser() || upcomingVisits.length || upcomingInstalls.length || mine.length;
    if(!show && !isHerdManagerUser()) return "";
    var hot = [];
    upcomingVisits.concat(upcomingInstalls).forEach(function(r){
      var n = r.customer||"";
      if(!n) return;
      var s = customerIssueStats(n);
      var risk = customerIssueRisk(s);
      if(risk==="hot" || risk==="warn") hot.push({name:n, stats:s, risk:risk, date:r.visitDate||r.herdHealthDate||r.deliveryDate});
    });
    var html = '<div class="herd-desk">';
    html += "<h3>Herd manager desk</h3>";

  function backupFileName(){
    return 'FTTechApp-backup-'+todayStr()+'.json';
  }
  function downloadBackupJson(){
    var json = JSON.stringify(state.data, null, 2);
    try{
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = backupFileName();
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 800);
      audit('export-backup', backupFileName());
      showToast('Downloaded '+backupFileName());
    }catch(e){
      state.modal = {type:'export-backup'};
      render();
      showToast('Could not download the file — copy the JSON instead');
    }
  }
