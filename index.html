  function renderImportModal(){
    var html = '<div class="modal-overlay" data-overlay="1"><div class="modal" style="max-width:640px;">'+
      '<div class="modal-head"><h3>Restore from Backup</h3><button class="modal-close" data-action="close-modal">&times;</button></div>'+
      '<div class="modal-body" style="grid-template-columns:1fr;">'+
        '<p style="font-size:13px;color:var(--crit);margin:0 0 10px 0;"><strong>This replaces all current data</strong> with a <strong>.json</strong> backup from Export Backup.</p>'+
        '<div class="field full"><label>Choose JSON file</label><input type="file" id="import-json-file" accept="application/json,.json"></div>'+
        '<textarea id="import-json-textarea" placeholder="Or paste backup JSON here…" style="width:100%;min-height:240px;font-family:monospace;font-size:11px;padding:10px;border:1px solid var(--line);border-radius:5px;"></textarea>'+
      '</div>'+
      '<div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn btn-danger" data-action="do-restore">Restore Backup</button></div>'+
      '</div></div>';
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    document.body.appendChild(wrap.firstChild);
    var fileEl = document.getElementById('import-json-file');
    var taImp = document.getElementById('import-json-textarea');
    if(fileEl && taImp){
      fileEl.addEventListener('change', function(){
        var f = fileEl.files && fileEl.files[0];
        if(!f) return;
        var reader = new FileReader();
        reader.onload = function(){ taImp.value = String(reader.result||''); showToast('Loaded '+f.name); };
        reader.onerror = function(){ showToast('Could not read that file'); };
        reader.readAsText(f);
      });

  function copyBackupToClipboard(){
    var ta = document.getElementById('export-json-textarea');
    if(!ta) return;
    ta.focus();
    ta.select();
    var done = function(){ showToast('Copied — paste it somewhere safe'); };
    var fail = function(){ showToast('Could not auto-copy — the text is selected, press Ctrl+C / Cmd+C'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done).catch(function(){
        try{ document.execCommand('copy'); done(); }catch(e){ fail(); }
      });
    } else {
      try{ document.execCommand('copy'); done(); }catch(e){ fail(); }
    }
  }
  function doRestoreBackup(){
    var ta = document.getElementById('import-json-textarea');
    if(!ta || !ta.value.trim()){ showToast('Choose a .json backup file or paste JSON first'); return; }
    var parsed;
    try{ parsed = JSON.parse(ta.value); }catch(e){ showToast("That doesn't look like valid backup JSON"); return; }
    if(!parsed.issues || !parsed.tasks || !parsed.archive || !parsed.lists){ showToast('Missing expected data — check you copied the whole backup'); return; }
    parsed.installs = parsed.installs || [];
    parsed.visits = parsed.visits || [];
    if(!confirm('This will replace ALL current data with this backup. This cannot be undone. Continue?')) return;
    state.data = parsed;
    saveData();
    closeModal();
    render();
    showToast('Backup restored');
  }

  function getRecord(kind, id){
    var found = findRecord(kind, id);
    return found ? found.record : null;

  function findRecord(kind, id){
    id = Number(id);
    if(kind==='install'){
      var inst = (state.data.installs||[]).find(function(r){ return Number(r.id)===id; });
      return inst ? {record:inst, source:'live'} : null;
    }
    if(kind==='visit'){
      var vis = (state.data.visits||[]).find(function(r){ return Number(r.id)===id; });
      if(vis) return {record:vis, source:'live'};
      var visArch = (state.data.archive||[]).find(function(r){ return Number(r.id)===id && isVisitRecord(r); });
      return visArch ? {record:visArch, source:'archive'} : null;
    }
    var live = kind==='issue' ? state.data.issues : state.data.tasks;
    var rec = (live||[]).find(function(r){ return Number(r.id)===id; });
    if(rec) return {record:rec, source:'live'};
    var arch = (state.data.archive||[]).find(function(r){
      if(Number(r.id)!==id) return false;
      if(isVisitRecord(r)) return false;
      if(kind==='issue') return isIssueRecord(r);
      return r.recordType==='task' || !isIssueRecord(r);
    });
    if(arch) return {record:arch, source:'archive'};
    return null;
  }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var reader = new FileReader();
      reader.onload = function(e){
        img.onload = function(){
          var w = img.width, h = img.height;
          if(w>h && w>maxDim){ h = Math.round(h*(maxDim/w)); w = maxDim; }
          else if(h>=w && h>maxDim){ w = Math.round(w*(maxDim/h)); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function photoTargetRecord(kind, id){
    var r = id ? getRecord(kind, id) : null;

  function handlePhotoFiles(files, kind, id){
    stashModalForm();
    var r = photoTargetRecord(kind, id);
    if(!r) return;
    r.photos = r.photos || [];
    var slotsLeft = 3 - r.photos.length;
    if(slotsLeft<=0){ showToast('Maximum 3 photos per record'); return; }
    var toProcess = Array.prototype.slice.call(files, 0, slotsLeft);
    Promise.all(toProcess.map(function(f){ return shrinkPhotoBlob(f); }))
      .then(function(dataUrls){
        dataUrls.forEach(function(u, i){ r.photos.push({id:'p-'+Date.now()+'-'+i, src:u}); });
        if(id && getRecord(kind, id)){
          touchRecord(r);
          saveData();
          if(kind==='issue') openDealerEmailPrompt(id, 'photo');
          else if(kind==='visit') autoNotifyDealership('visit', r, 'photo');
        }
        render();
        showToast(dataUrls.length+' photo'+(dataUrls.length===1?'':'s')+' added (shrunk for sync)');
      })
      .catch(function(){ showToast('Could not process that image'); });
  }
  function handleFileFiles(fileList, kind, id){
    stashModalForm();
    var r = photoTargetRecord(kind, id);
    if(!r) return;
    r.files = r.files || [];
    var slots = FILE_MAX_N() - r.files.length;
    if(slots<=0){ showToast('Maximum 3 files per record'); return; }
    var arr = Array.prototype.slice.call(fileList, 0, slots);
    var added = 0;
    function next(i){
      if(i>=arr.length){
        if(added && id && getRecord(kind, id)){
          touchRecord(r);
          saveData();
          if(kind==='issue') openDealerEmailPrompt(id, 'photo');
          else if(kind==='visit') autoNotifyDealership('visit', r, 'photo');
        }
        render();
        if(added) showToast(added+' file'+(added===1?'':'s')+' attached');
        return;
      }
      var f = arr[i];
      if(!fileAllowed(f)){ showToast(f.name+' is not an allowed file type'); return next(i+1); }
      if(f.size > FILE_MAX()){ showToast(f.name+' is over 1.5 MB — compress it or use a photo'); return next(i+1); }
      var reader = new FileReader();
      reader.onload = function(e){
        r.files.push({id:'f-'+Date.now()+'-'+i, name:f.name, mime:f.type||'', size:f.size, src:e.target.result});
        added++;
        next(i+1);
      };
      reader.onerror = function(){ showToast('Could not read '+f.name); next(i+1); };
      reader.readAsDataURL(f);
    }
    next(0);
  }

  function deleteRecord(type, id){
    if(!confirm('Delete this '+type+' permanently? This cannot be undone.')) return;
    var list = type==='issue' ? state.data.issues : state.data.tasks;
    var idx = list.findIndex(function(r){ return r.id===id; });
    if(idx>-1) list.splice(idx,1);
    markDeleted(type, id);
    saveData();
    render();
    showToast(type[0].toUpperCase()+type.slice(1)+' deleted');
  }
  function archiveResolved(kind){
    if(kind==='visits' || kind==='visit'){
      var vKeep = [];
      var vMoved = 0;
      (state.data.visits||[]).forEach(function(r){
        if(isClosedStatus(r.status)){
          var archived = Object.assign({}, r, {recordType:'visit', archivedDate: todayStr()});
          state.data.archive = state.data.archive || [];
          var already = state.data.archive.some(function(a){ return Number(a.id)===Number(r.id) && isVisitRecord(a); });
          if(!already) state.data.archive.unshift(archived);
          markDeleted('visit', r.id);
          vMoved++;
        } else vKeep.push(r);
      });
      state.data.visits = vKeep;
      saveData();
      render();
      showToast(vMoved+' herd visit'+(vMoved===1?'':'s')+' moved to Archive');
      return;
    }
    var isIssue = kind==='issues';
    var list = isIssue ? state.data.issues : state.data.tasks;
    var keep = [];
    var movedCount = 0;
    list.forEach(function(r){
      var s = (r.status||'').toLowerCase();
      if(s==='resolved' || s==='closed' || s==='done'){
        var recType = isIssue?'issue':'task';
        var archived = Object.assign({}, r, {recordType: recType, archivedDate: todayStr()});
        state.data.archive = state.data.archive || [];
        var already = state.data.archive.some(function(a){
          return Number(a.id)===Number(r.id) && a.recordType===recType;
        });
        if(!already) state.data.archive.unshift(archived);
        markDeleted(isIssue?'issue':'task', r.id);
        movedCount++;
      } else {
        keep.push(r);
      }
    });
    if(isIssue) state.data.issues = keep; else state.data.tasks = keep;
    saveData();
    render();
    showToast(movedCount+' record'+(movedCount===1?'':'s')+' moved to Archive');
  }
  function addListItem(group, value){
    value = String(value||'').trim();
    if(!value) return;
    if(group==='visitTypes') value = canonicalVisitType(value) || value;
    var arr = state.data.lists[group];
    var exists = arr.some(function(v){
      if(v===value) return true;
      if(group==='visitTypes' && visitTypeKey(canonicalVisitType(v)||v)===visitTypeKey(value)) return true;
      return false;
    });
    if(exists){ showToast('Already in the list'); return; }
    arr.push(value);
    if(group==='customers') sortCustomersList();
    saveData();
    render();
  }

    }
    document.body.oninput = function(e){
      if(e.target && e.target.id==='global-search') paintSearchDrop(e.target);
    };
    var gs = document.getElementById('global-search');
    if(gs){
      gs.addEventListener('click', function(e){ e.stopPropagation(); if(String(gs.value||'').trim().length>=2) paintSearchDrop(gs); });
      gs.addEventListener('keydown', function(e){
        if(e.key==='Escape'){ state.searchOpen=false; state.searchQ=''; render(); }
        if(e.key==='Enter'){
          e.preventDefault();
          var hits = globalSearchHits(gs.value);
          if(hits[0]) openSearchHit(hits[0]);
        }
      });
    }
    var c360 = document.getElementById('c360-find');
    if(c360){
      c360.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); openCustomer360(c360.value); } });
    }
    document.querySelectorAll('.swipe-host').forEach(function(host){
      var startX=0, startY=0, dx=0, tracking=false;
      var sheet = host.querySelector('.issue-row');
      if(!sheet) return;
      host.addEventListener('touchstart', function(e){
        if(!e.touches || !e.touches[0]) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY; dx=0; tracking=true;
        sheet.style.transition='none';
      }, {passive:true});
      host.addEventListener('touchmove', function(e){
        if(!tracking || !e.touches[0]) return;
        var mx = e.touches[0].clientX - startX;
        var my = e.touches[0].clientY - startY;
        if(Math.abs(my)>Math.abs(mx) && Math.abs(my)>12){ tracking=false; sheet.style.transform=''; return; }
        dx = mx;
        if(Math.abs(dx)>8) sheet.style.transform='translateX('+Math.max(-88, Math.min(88, dx))+'px)';
      }, {passive:true});
      host.addEventListener('touchend', function(){
        sheet.style.transition='transform .18s ease';
        var kind = host.getAttribute('data-swipe-kind');
        var id = parseInt(host.getAttribute('data-swipe-id'),10);
        if(tracking && dx>64){
          sheet.style.transform='';
          if(canWrite()){ state.modal={type:'add-note', kind:kind, id:id}; render(); return; }
        } else if(tracking && dx<-64){
          sheet.style.transform='';
          if(canWrite()){ state.modal={type:'add-time', kind:kind, id:id}; render(); return; }
        }
        sheet.style.transform='';
        tracking=false; dx=0;
      });
    });
    if(state.pendingFocus){
      var pf = state.pendingFocus;
      state.pendingFocus = null;
      var focusId = (pf.target==='hours' ? 'q-hours-' : 'q-note-')+pf.kind+'-'+pf.id;
      var focusEl = document.getElementById(focusId);
      if(focusEl){
        try { focusEl.focus(); } catch(err){}
        if(focusEl.scrollIntoView) focusEl.scrollIntoView({block:'nearest'});
      }
    }
  }

  // ---------- init ----------
  function restoreSessionFromIdb(cb){
    try{
      var req = indexedDB.open('fttech-session-db', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('s'); };
      req.onsuccess = function(){
        try{
          var db = req.result;
          if(!db.objectStoreNames.contains('s')){ cb(); return; }
          var tx = db.transaction('s','readonly');
          var g = tx.objectStore('s').get('session');
          g.onsuccess = function(){
            var s = parseSessionRaw(g.result);
            if(s && !state.session){ state.session = s; persistSession(); }
            cb();
          };
          g.onerror = function(){ cb(); };
        }catch(e){ cb(); }
      };
      req.onerror = function(){ cb(); };
    }catch(e){ cb(); }
  }
  function init(){
    if(!state.session) state.session = loadSession();
    restoreSessionFromIdb(function(){
    loadData().then(function(d){
      try{
      state.data = d;
      if(!state.data.lists) state.data.lists = {};
      ['issues','tasks','archive','installs','visits'].forEach(function(k){
        if(!Array.isArray(state.data[k])) state.data[k] = [];
      });
      var changed = false;
      Object.keys(DEFAULT_LISTS).forEach(function(k){
        var def = DEFAULT_LISTS[k];
        if(Array.isArray(def)){
          if(!Array.isArray(state.data.lists[k])){
            state.data.lists[k] = def.slice();
            changed = true;
          } else if(def.length){
            def.forEach(function(v){
              if(state.data.lists[k].indexOf(v) === -1){
                state.data.lists[k].push(v);
                changed = true;
              }
            });
          }
        } else if(def && typeof def === 'object'){
          if(!state.data.lists[k] || typeof state.data.lists[k] !== 'object' || Array.isArray(state.data.lists[k])){
            state.data.lists[k] = Object.assign({}, def);
            changed = true;
          }
        }
      });
      if(!state.data.lists.visitTypeColors || typeof state.data.lists.visitTypeColors !== 'object' || Array.isArray(state.data.lists.visitTypeColors)){
        state.data.lists.visitTypeColors = {};
        changed = true;
      }
      if(dedupeVisitTypes()) changed = true;
      if(harvestSavedEmails()) changed = true;
      if(harvestDealerPeople()) changed = true;
      if(!Array.isArray(state.data.visits)){ state.data.visits = []; changed = true; }
      if(!state.filters.installs){
        state.filters.installs = {q:"",dealership:"",sort:"delivery",sortDir:"asc"};
      }
      if(!state.filters.visits){
        state.filters.visits = {q:"",dealership:"",sort:"visit",sortDir:"desc"};
      }
      if(!state.data.issues.length && !state.data.tasks.length && !state.data.archive.length && (SEED_RECORDS.issues.length || SEED_RECORDS.tasks.length || SEED_RECORDS.archive.length)){
        state.data.issues = JSON.parse(JSON.stringify(SEED_RECORDS.issues));
        state.data.tasks = JSON.parse(JSON.stringify(SEED_RECORDS.tasks));
        state.data.archive = JSON.parse(JSON.stringify(SEED_RECORDS.archive));
        changed = true;
      }
      // migration: move any old-shape task record (has a dealership field — pre Task Tracker redesign) into Active Issues
      var stillTasks = [];
      state.data.tasks.forEach(function(t){
        if(t.dealership !== undefined){
          var maxId = Math.max(0, state.data.issues.reduce(function(m,r){return Math.max(m,r.id);},0));
          state.data.issues.unshift({
            id: maxId+1,
            dateLogged: t.dateLogged,
            dealership: t.dealership,
            product: t.product,
            priority: (['Critical','High','Medium','Low'].indexOf(t.priority)>-1) ? t.priority : 'Medium',
            status: t.status,
            title: t.title,
            description: t.description,
            loggedBy: t.loggedBy,
            lastUpdated: t.lastUpdated,
            updates: [{date: t.lastUpdated || t.dateLogged, author: t.loggedBy||'', text: ((t.notes||'').trim()) || 'Migrated from the old Task Tracker tab during the app rebuild — priority reviewed, please confirm.'}],
            photos: []
          });
          changed = true;
        } else {
          stillTasks.push(t);
        }
      });
      state.data.tasks = stillTasks;
      // migration: old "Blocked" status value -> status "In Progress" + blocked flag
      state.data.tasks.forEach(function(t){
        if(t.status==='Blocked'){
          t.status = 'In Progress';
          t.blocked = true;
          changed = true;
        }
        if(t.blocked===undefined){ t.blocked = false; }
        // old task priority labels (Critical/High/Medium/Low) predate the 1-10 scale — clear so it's obviously unset rather than silently wrong
        if(t.priority && isNaN(parseInt(t.priority,10))){
          t.priority = '';
          changed = true;
        }
      });
      // migration: notes (string) -> updates (array); ensure photos array exists — applies to issues, tasks, and archive
      [state.data.issues, state.data.tasks, state.data.archive].forEach(function(list){
        list.forEach(function(r){
          if(r.notes !== undefined){
            var txt = (r.notes||'').trim();
            r.updates = r.updates || [];
            if(txt) r.updates.push({date: r.lastUpdated || r.dateLogged, author: r.loggedBy||'', text: txt});
            delete r.notes;
            changed = true;
          }
          if(!r.updates) { r.updates = []; changed = true; }
          if(!r.photos) { r.photos = []; changed = true; }
          if(!r.timeEntries) { r.timeEntries = []; changed = true; }
          if(r.customerInfo===undefined && (r.category===undefined)){ r.customerInfo = ''; changed = true; }
          if(r.customer===undefined && (r.category===undefined)){
            r.customer = (r.customerInfo||'').trim();
            changed = true;
          }
        });
      });
      if(ensureUsers()) changed = true;
      if(reconcileDuplicateIds()) changed = true;
      if(changed) saveData();
      if(!state.session) state.session = loadSession();
      if(state.session){
        var sessUser = findUser(state.session.name);
        if(sessUser){
          state.session.name = sessUser.name;
          state.session.role = sessUser.role || state.session.role;
        }
        persistSession();
      }
      if(state.session && allowedViews().indexOf(state.view) === -1) state.view = "dashboard";
      if(state.session) heartbeatDevice(true);
      setTimeout(runScheduledMails, 1200);
      state.loading = false;
      render();
      }catch(err){
        console.error(err);
        state.loading = false;
        if(!state.data) state.data = defaultData();
        ['issues','tasks','archive','installs','visits','users','audit','devices'].forEach(function(k){
          if(!Array.isArray(state.data[k])) state.data[k] = [];
        });
        if(!state.data.lists) state.data.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
        try{ render(); }catch(e2){ paintBootError(err); }
      }
    }).catch(function(err){
      console.error(err);
      state.loading = false;
      if(!state.data) state.data = defaultData();
      try{ render(); }catch(e2){ paintBootError(err); }
    });
    });
  }

  function paintBootError(err){
    var app = document.getElementById('app');
    if(!app) return;
    app.innerHTML = '<div class="login-screen"><div class="login-card"><h1>FTTechApp</h1>'+
      '<p class="hint">Could not start this version. Refresh the page. If it stays blank, the error is:</p>'+
      '<p class="hint">'+esc(String((err && err.message) || err || 'unknown'))+'</p>'+
      '<button type="button" class="btn btn-primary" style="width:100%;justify-content:center;" onclick="location.reload()">Refresh</button></div></div>';
  }

  try {
    render(); // initial loading screen
    init();
  } catch(err){
    paintBootError(err);
  }
})();
</script>
